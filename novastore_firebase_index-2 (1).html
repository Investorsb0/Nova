<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NovaStore</title>

<style>
*{
 box-sizing:border-box;
 font-family:Arial,sans-serif
}

body{
 margin:0;
 background:#f5f6f8;
 color:#172033
}

header{
 background:#111827;
 color:#fff;
 position:sticky;
 top:0;
 z-index:5
}

.top{
 max-width:1100px;
 margin:auto;
 padding:14px;
 display:flex;
 gap:10px;
 align-items:center
}

.logo{
 font-size:22px;
 font-weight:800;
 flex:1
}

.search{
 flex:2;
 padding:11px;
 border-radius:8px;
 border:0
}

.btn{
 padding:10px 13px;
 border:0;
 border-radius:8px;
 cursor:pointer
}

.primary{
 background:#111827;
 color:#fff
}

.green{
 background:#16a34a;
 color:#fff
}

.red{
 background:#dc2626;
 color:#fff
}

.secondary{
 background:#e5e7eb;
 color:#111827
}

.hero{
 max-width:1100px;
 margin:18px auto;
 padding:25px
}

.hero div{
 background:#111827;
 color:#fff;
 padding:30px;
 border-radius:18px
}

.filters,
.products{
 max-width:1100px;
 margin:auto;
 padding:0 15px
}

.filters{
 margin-bottom:15px
}

.filters select{
 padding:10px;
 border:1px solid #ddd;
 border-radius:8px
}

.products{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
 gap:15px;
 padding-bottom:40px
}

.card{
 background:#fff;
 border-radius:13px;
 overflow:hidden;
 box-shadow:0 2px 9px #0001
}

.pic{
 height:175px;
 background:#eee;
 display:flex;
 align-items:center;
 justify-content:center
}

.pic img{
 width:100%;
 height:100%;
 object-fit:cover
}

.info{
 padding:14px
}

.cat{
 font-size:12px;
 color:#687386
}

.name{
 font-weight:bold;
 margin:7px 0
}

.old{
 text-decoration:line-through;
 color:#888;
 font-size:13px
}

.price{
 font-size:19px;
 font-weight:bold;
 margin:6px 0
}

.add{
 width:100%;
 margin-top:10px
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:10;
 padding:15px;
 overflow:auto
}

.modal.show{
 display:block
}

.panel{
 background:white;
 max-width:600px;
 margin:30px auto;
 padding:20px;
 border-radius:14px
}

.field{
 margin:10px 0
}

.field label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-bottom:5px
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:11px;
 border:1px solid #ddd;
 border-radius:8px
}

.actions{
 display:flex;
 gap:8px;
 margin-top:15px;
 flex-wrap:wrap
}

.cartrow{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:12px 0;
 border-bottom:1px solid #eee
}

.message{
 margin-top:12px;
 padding:10px;
 border-radius:8px;
 background:#f3f4f6
}

.accountInfo{
 background:#f3f4f6;
 padding:12px;
 border-radius:8px;
 margin:10px 0
}

#accountMsg,
#cartMsg{
 margin-top:12px
}

@media(max-width:650px){

 .top{
  flex-wrap:wrap
 }

 .search{
  order:3;
  flex-basis:100%
 }

 .hero{
  padding:10px
 }

 .products{
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:0 10px 30px
 }

 .pic{
  height:140px
 }

 .cartrow{
  flex-direction:column
 }

}
</style>
</head>

<body>

<header>

<div class="top">

<div class="logo">
NovaStore
</div>

<input
 id="search"
 class="search"
 placeholder="Search products"
>

<button
 class="btn secondary"
 onclick="openCart()"
>
Cart (<span id="count">0</span>)
</button>

<button
 class="btn secondary"
 id="account"
 onclick="openAccount()"
>
Login
</button>

</div>

</header>


<section class="hero">

<div>

<h1>Welcome to NovaStore</h1>

<p>Quality products at great prices.</p>

</div>

</section>


<div class="filters">

<select id="category">

<option value="all">
All categories
</option>

</select>

</div>


<main
 id="products"
 class="products"
>

<p>Loading products...</p>

</main>


<footer
 style="text-align:center;padding:30px;color:#687386"
>

© 2026 NovaStore

</footer>


<!-- ACCOUNT -->

<div
 id="accountModal"
 class="modal"
>

<div class="panel">

<h2>Customer Account</h2>


<!-- LOGGED IN -->

<div
 id="loggedInBox"
 style="display:none"
>

<div class="accountInfo">

You are logged in as:

<strong id="loggedEmail"></strong>

</div>

<div class="actions">

<button
 class="btn red"
 onclick="logoutCustomer()"
>
Logout
</button>

<button
 class="btn secondary"
 onclick="closeM('accountModal')"
>
Close
</button>

</div>

</div>


<!-- LOGIN -->

<div id="loginBox">

<div class="field">

<label>Email</label>

<input
 id="email"
 type="email"
 autocomplete="email"
>

</div>


<div class="field">

<label>Password</label>

<input
 id="password"
 type="password"
 autocomplete="current-password"
>

</div>


<div class="actions">

<button
 id="loginBtn"
 class="btn primary"
 onclick="login()"
>
Login
</button>

<button
 id="registerBtn"
 class="btn green"
 onclick="register()"
>
Create account
</button>

<button
 class="btn secondary"
 onclick="closeM('accountModal')"
>
Close
</button>

</div>

</div>


<p id="accountMsg"></p>

</div>

</div>


<!-- CART -->

<div
 id="cartModal"
 class="modal"
>

<div class="panel">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<h3 id="total">
Total: ₦0
</h3>


<div class="field">

<label>Payment method</label>

<select id="paymentMethod">

<option value="bank_transfer">
Bank Transfer
</option>

<option value="cash_on_delivery">
Cash on Delivery
</option>

</select>

</div>


<div
 id="bankInfo"
 class="message"
>

<strong>Bank Transfer</strong>

<p>
Your order will be recorded first. Only send payment using official NovaStore payment details.
</p>

</div>


<div class="actions">

<button
 class="btn green"
 onclick="checkout()"
>
Place Order
</button>

<button
 class="btn secondary"
 onclick="closeM('cartModal')"
>
Close
</button>

</div>

<p id="cartMsg"></p>

</div>

</div>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
 getDatabase,
 ref,
 onValue,
 push,
 set
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


import {
 getAuth,
 onAuthStateChanged,
 signInWithEmailAndPassword,
 createUserWithEmailAndPassword,
 signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

 apiKey:
 "AIzaSyCNrU3igTkkcQ0Z6Zq1dluKw_s_3yHovE",

 authDomain:
 "novastore-6fd18.firebaseapp.com",

 databaseURL:
 "https://novastore-6fd18-default-rtdb.asia-southeast1.firebasedatabase.app",

 projectId:
 "novastore-6fd18",

 storageBucket:
 "novastore-6fd18.firebasestorage.app",

 messagingSenderId:
 "783420364153",

 appId:
 "1:783420364153:web:1b56b655e3e804726d8ba8",

 measurementId:
 "G-Q760SBLPLT"

};


/* FIREBASE */

const firebaseApp =
 initializeApp(firebaseConfig);

const db =
 getDatabase(firebaseApp);

const auth =
 getAuth(firebaseApp);


/* DATA */

let products = {};

let cart = [];

try{

 cart =
 JSON.parse(
  localStorage.getItem("novaCart") || "[]"
 );

 if(!Array.isArray(cart)){
  cart=[];
 }

}catch{

 cart=[];

}

let user = null;


/* ELEMENTS */

const productsBox =
 document.getElementById("products");

const searchInput =
 document.getElementById("search");

const categoryInput =
 document.getElementById("category");

const accountButton =
 document.getElementById("account");

const accountModal =
 document.getElementById("accountModal");

const cartModal =
 document.getElementById("cartModal");

const count =
 document.getElementById("count");

const cartItems =
 document.getElementById("cartItems");

const total =
 document.getElementById("total");

const cartMsg =
 document.getElementById("cartMsg");

const accountMsg =
 document.getElementById("accountMsg");

const loginBox =
 document.getElementById("loginBox");

const loggedInBox =
 document.getElementById("loggedInBox");

const loggedEmail =
 document.getElementById("loggedEmail");

const emailInput =
 document.getElementById("email");

const passwordInput =
 document.getElementById("password");

const paymentMethod =
 document.getElementById("paymentMethod");

const bankInfo =
 document.getElementById("bankInfo");

const loginBtn =
 document.getElementById("loginBtn");

const registerBtn =
 document.getElementById("registerBtn");


/* MONEY */

function money(n){

 return "₦" +
 Number(n || 0)
 .toLocaleString("en-NG");

}


/* SAFE TEXT */

function safe(s){

 return String(s ?? "")
 .replace(
  /[&<>"']/g,
  function(c){

   return {
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
   }[c];

  }
 );

}


/* LOAD PRODUCTS */

onValue(
 ref(db,"products"),

 snapshot => {

  products =
  snapshot.val() || {};

  renderCategories();

  renderProducts();

 },

 error => {

  console.error(error);

  productsBox.innerHTML =
  "<p>Unable to load products.</p>";

 }
);


/* AUTH STATE */

onAuthStateChanged(
 auth,

 currentUser => {

  user =
  currentUser;

  if(user){

   accountButton.textContent =
   "Account";

   loggedEmail.textContent =
   user.email || "";

  }else{

   accountButton.textContent =
   "Login";

   loggedEmail.textContent =
   "";

  }

 }
);


/* CATEGORIES */

function renderCategories(){

 const old =
 categoryInput.value;

 const categories =
 [
  ...new Set(
   Object.values(products)
   .map(
    p => p.category
   )
   .filter(Boolean)
  )
 ];

 categoryInput.innerHTML =
 '<option value="all">All categories</option>' +

 categories
 .map(
  category =>
  `<option value="${safe(category)}">
   ${safe(category)}
  </option>`
 )
 .join("");

 if(categories.includes(old)){

  categoryInput.value=old;

 }else{

  categoryInput.value="all";

 }

}


/* PRODUCTS */

function renderProducts(){

 const search =
 searchInput.value
 .toLowerCase()
 .trim();

 const selectedCategory =
 categoryInput.value;

 const list =
 Object.entries(products)
 .filter(
  ([id,p]) => {

   const name =
   String(p.name || "")
   .toLowerCase();

   const matchesSearch =
   name.includes(search);

   const matchesCategory =
   selectedCategory === "all" ||
   p.category === selectedCategory;

   const available =
   p.available !== false;

   return (
    matchesSearch &&
    matchesCategory &&
    available
   );

  }
 );


 if(!list.length){

  productsBox.innerHTML =
  "<p>No products found.</p>";

  return;

 }


 productsBox.innerHTML =
 list.map(
  ([id,p]) => {

   const image =
   p.image
   ?
   `<img
    src="${safe(p.image)}"
    alt="${safe(p.name)}"
    onerror="this.style.display='none'"
   >`
   :
   "🛍️";


   const oldPrice =
   p.oldPrice
   ?
   `<div class="old">
    ${money(p.oldPrice)}
   </div>`
   :
   "";


   return `

   <article class="card">

   <div class="pic">
   ${image}
   </div>

   <div class="info">

   <div class="cat">
   ${safe(p.category || "General")}
   </div>

   <div class="name">
   ${safe(p.name)}
   </div>

   ${oldPrice}

   <div class="price">
   ${money(p.price)}
   </div>

   <small>
   ${safe(
    p.description ||
    "Available now"
   )}
   </small>

   <button
    class="btn green add"
    onclick="addToCart('${id}')"
   >
   Add to Cart
   </button>

   </div>

   </article>

   `;

  }
 ).join("");

}


searchInput.addEventListener(
 "input",
 renderProducts
);


categoryInput.addEventListener(
 "change",
 renderProducts
);


/* ADD TO CART */

window.addToCart =
 function(id){

  if(!products[id]){

   alert(
    "This product is unavailable."
   );

   return;

  }


  const existing =
  cart.find(
   item => item.id === id
  );


  if(existing){

   existing.qty += 1;

  }else{

   cart.push({
    id:id,
    qty:1
   });

  }


  saveCart();

  alert(
   "Added to cart."
  );

 };


/* SAVE CART */

function saveCart(){

 localStorage.setItem(
  "novaCart",
  JSON.stringify(cart)
 );


 count.textContent =
 cart.reduce(
  (sum,item) =>
  sum + Number(item.qty || 0),
  0
 );

}


/* OPEN CART */

window.openCart =
 function(){

  renderCart();

  cartModal.classList.add(
   "show"
  );

 };


/* RENDER CART */

function renderCart(){

 cart =
 cart.filter(
  item =>
  products[item.id]
 );


 saveCart();


 if(!cart.length){

  cartItems.innerHTML =
  "<p>Your cart is empty.</p>";

 }else{

  cartItems.innerHTML =
  cart.map(
   item => {

    const p =
    products[item.id];

    return `

    <div class="cartrow">

    <div>

    <strong>
    ${safe(p.name)}
    </strong>

    <br>

    ${money(p.price)}
    × ${item.qty}

    </div>

    <div>

    <button
     class="btn secondary"
     onclick="
      changeQty(
       '${item.id}',
       -1
      )
     "
    >
    −
    </button>

    <button
     class="btn secondary"
     onclick="
      changeQty(
       '${item.id}',
       1
      )
     "
    >
    +
    </button>

    </div>

    </div>

    `;

   }
  ).join("");

 }


 const totalAmount =
 cart.reduce(
  (sum,item) =>
  sum +
  (
   Number(
    products[item.id]?.price || 0
   )
   *
   Number(item.qty || 0)
  ),
  0
 );


 total.textContent =
 "Total: " +
 money(totalAmount);

 cartMsg.textContent="";

 updatePaymentInfo();

}


/* CHANGE QUANTITY */

window.changeQty =
 function(id,change){

  const item =
  cart.find(
   x => x.id === id
  );

  if(!item)return;


  item.qty =
  Number(item.qty || 0) +
  change;


  if(item.qty <= 0){

   cart =
   cart.filter(
    x => x.id !== id
   );

  }


  saveCart();

  renderCart();

 };


/* PAYMENT */

function updatePaymentInfo(){

 if(
  paymentMethod.value ===
  "bank_transfer"
 ){

  bankInfo.style.display =
  "block";

 }else{

  bankInfo.style.display =
  "none";

 }

}


paymentMethod.addEventListener(
 "change",
 updatePaymentInfo
);


/* CHECKOUT */

window.checkout =
 async function(){

  cartMsg.textContent="";


  if(!cart.length){

   cartMsg.textContent =
   "Your cart is empty.";

   return;

  }


  if(!user){

   cartMsg.textContent =
   "Please login or create an account first.";

   return;

  }


  const items =
  cart.map(
   item => ({

    productId:
    item.id,

    name:
    products[item.id]?.name || "",

    price:
    Number(
     products[item.id]?.price || 0
    ),

    quantity:
    Number(item.qty || 0)

   })
  );


  const orderTotal =
  items.reduce(
   (sum,item) =>
   sum +
   item.price *
   item.quantity,
   0
  );


  try{

   const orderRef =
   push(
    ref(db,"orders")
   );


   await set(
    orderRef,
    {

     userId:
     user.uid,

     email:
     user.email,

     items:
     items,

     total:
     orderTotal,

     paymentMethod:
     paymentMethod.value,

     status:
     "pending",

     createdAt:
     Date.now()

    }
   );


   cart=[];

   saveCart();

   renderCart();


   cartMsg.textContent =
   "Order placed successfully.";

  }catch(error){

   console.error(error);

   cartMsg.textContent =
   "Order failed: " +
   error.message;

  }

 };


/* OPEN ACCOUNT */

window.openAccount =
 function(){

  accountMsg.textContent="";


  if(user){

   loginBox.style.display =
   "none";

   loggedInBox.style.display =
   "block";

   loggedEmail.textContent =
   user.email || "";

  }else{

   loginBox.style.display =
   "block";

   loggedInBox.style.display =
   "none";

  }


  accountModal.classList.add(
   "show"
  );

 };


/* LOGIN */

window.login =
 async function(){

  const email =
  emailInput.value.trim();

  const password =
  passwordInput.value;


  if(!email){

   accountMsg.textContent =
   "Enter your email.";

   return;

  }


  if(!password){

   accountMsg.textContent =
   "Enter your password.";

   return;

  }


  loginBtn.disabled=true;

  registerBtn.disabled=true;

  accountMsg.textContent =
  "Checking your account...";


  try{

   /*
    IMPORTANT:
    Firebase Authentication itself
    decides whether the email/password
    are valid.
   */

   const result =
   await signInWithEmailAndPassword(
    auth,
    email,
    password
   );


   /*
    Verify that Firebase actually
    returned a user.
   */

   if(
    !result ||
    !result.user
   ){

    throw new Error(
     "Firebase did not authenticate this account."
    );

   }


   user =
   result.user;


   accountMsg.textContent =
   "Login successful.";


   loggedEmail.textContent =
   user.email || "";

   loginBox.style.display =
   "none";

   loggedInBox.style.display =
   "block";


  }catch(error){

   console.error(
    "LOGIN ERROR:",
    error
   );


   /*
    If Firebase rejects the credentials,
    the user MUST NOT be treated as logged in.
   */

   user=null;


   if(
    error.code ===
    "auth/invalid-credential"
   ){

    accountMsg.textContent =
    "Incorrect email or password.";

   }else if(
    error.code ===
    "auth/user-not-found"
   ){

    accountMsg.textContent =
    "No account exists with this email.";

   }else if(
    error.code ===
    "auth/wrong-password"
   ){

    accountMsg.textContent =
    "Incorrect password.";

   }else if(
    error.code ===
    "auth/invalid-email"
   ){

    accountMsg.textContent =
    "Please enter a valid email.";

   }else if(
    error.code ===
    "auth/too-many-requests"
   ){

    accountMsg.textContent =
    "Too many attempts. Please try again later.";

   }else{

    accountMsg.textContent =
    error.message ||
    "Login failed.";

   }

  }finally{

   loginBtn.disabled=false;

   registerBtn.disabled=false;

  }

 };


/* REGISTER */

window.register =
 async function(){

  const email =
  emailInput.value.trim();

  const password =
  passwordInput.value;


  if(!email){

   accountMsg.textContent =
   "Enter your email.";

   return;

  }


  if(!password){

   accountMsg.textContent =
   "Enter a password.";

   return;

  }


  if(password.length < 6){

   accountMsg.textContent =
   "Password must be at least 6 characters.";

   return;

  }


  loginBtn.disabled=true;

  registerBtn.disabled=true;

  accountMsg.textContent =
  "Creating account...";


  try{

   const result =
   await createUserWithEmailAndPassword(
    auth,
    email,
    password
   );


   await set(
    ref(
     db,
     "users/" +
     result.user.uid
    ),
    {

     email:
     result.user.email,

     createdAt:
     Date.now()

    }
   );


   user =
   result.user;


   accountMsg.textContent =
   "Account created successfully.";

   loggedEmail.textContent =
   user.email || "";

   loginBox.style.display =
   "none";

   loggedInBox.style.display =
   "block";


  }catch(error){

   console.error(error);


   if(
    error.code ===
    "auth/email-already-in-use"
   ){

    accountMsg.textContent =
    "This email already has an account. Please login.";

   }else if(
    error.code ===
    "auth/invalid-email"
   ){

    accountMsg.textContent =
    "Please enter a valid email.";

   }else if(
    error.code ===
    "auth/weak-password"
   ){

    accountMsg.textContent =
    "Password must be at least 6 characters.";

   }else{

    accountMsg.textContent =
    error.message ||
    "Could not create account.";

   }

  }finally{

   loginBtn.disabled=false;

   registerBtn.disabled=false;

  }

 };


/* LOGOUT */

window.logoutCustomer =
 async function(){

  try{

   await signOut(auth);

   user=null;

   loggedInBox.style.display =
   "none";

   loginBox.style.display =
   "block";

   accountButton.textContent =
   "Login";

   accountMsg.textContent =
   "You have been logged out.";

  }catch(error){

   accountMsg.textContent =
   error.message;

  }

 };


/* CLOSE MODAL */

window.closeM =
 function(id){

  document
  .getElementById(id)
  .classList.remove(
   "show"
  );

 };


/* INITIALIZE */

saveCart();

updatePaymentInfo();

</script>

</body>
    </html>
